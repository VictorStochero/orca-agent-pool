# Contas da máquina. Ordem = prioridade.
# peso = tamanho do plano em relação ao menor; o ritmo da escolha do escritor é multiplicado por ele.
escolha=ritmo
teto=0
ram_min=3

main     agente=claude vagas=0 peso=10 papeis=orquestra
work     agente=claude config=~/.claude-work vagas=1 peso=1 papeis=escritor,revisor,verificador,mecanico
extra    agente=claude config=~/.claude-extra vagas=3 peso=5 papeis=escritor,revisor,verificador,mecanico
codex    agente=codex vagas=1 peso=1 papeis=escritor,mecanico
review   agente=antigravity vagas=1 papeis=segunda-opiniao peso=1
custom   agente=claude comando="claude-custom" vagas=1 papeis=revisor
opencode agente=opencode vagas=2 papeis=segunda-opiniao ativo=nao
